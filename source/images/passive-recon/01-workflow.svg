<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="530" viewBox="0 0 1400 530"><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><rect width="1400" height="530" rx="24" fill="#101e35"/>
