<text x="54" y="58" font-size="16" letter-spacing="3" fill="#72d5c3">PASSIVE RECON · LAB NOTES</text>
<text x="54" y="118" font-size="40" font-weight="700" fill="white">从公开线索到可复查的子域名记录</text>
<text x="54" y="155" font-size="21" fill="#b9c8dd">iana.org　·　2026 年 11 月 8 日　·　公开索引与 DNS 查询</text><rect x="54" y="205" width="304" height="208" rx="16" fill="#1c304b" stroke="#36506e"/><text x="77" y="245" font-size="22" fill="#72d5c3">01</text><text x="77" y="288" font-size="27" font-weight="700" fill="white">确定范围</text><text x="77" y="335" font-size="18" fill="#e3edf6">根域名 iana.org</text><text x="77" y="373" font-size="17" fill="#b9c8dd">保留完整的多级子域名</text><path d="M363 308h15m-6-6 6 6-6 6" stroke="#72d5c3" stroke-width="2" fill="none"/><rect x="384" y="205" width="304" height="208" rx="16" fill="#1c304b" stroke="#36506e"/><text x="407" y="245" font-size="22" fill="#72d5c3">02</text><text x="407" y="288" font-size="27" font-weight="700" fill="white">查询公开线索</text><text x="407" y="335" font-size="18" fill="#e3edf6">资产搜索与证书日志</text><text x="407" y="373" font-size="17" fill="#b9c8dd">记录语句、时间和访问状态</text><path d="M693 308h15m-6-6 6 6-6 6" stroke="#72d5c3" stroke-width="2" fill="none"/><rect x="714" y="205" width="304" height="208" rx="16" fill="#1c304b" stroke="#36506e"/><text x="737" y="245" font-size="22" fill="#72d5c3">03</text><text x="737" y="288" font-size="27" font-weight="700" fill="white">整理候选名称</text><text x="737" y="335" font-size="18" fill="#e3edf6">拆行、筛选、去重</text><text x="737" y="373" font-size="17" fill="#b9c8dd">通配符与具体名称分别记录</text><path d="M1023 308h15m-6-6 6 6-6 6" stroke="#72d5c3" stroke-width="2" fill="none"/><rect x="1044" y="205" width="304" height="208" rx="16" fill="#1c304b" stroke="#36506e"/><text x="1067" y="245" font-size="22" fill="#72d5c3">04</text><text x="1067" y="288" font-size="27" font-weight="700" fill="white">抽查 DNS</text><text x="1067" y="335" font-size="18" fill="#e3edf6">查看 A、AAAA 与 CNAME</text><text x="1067" y="373" font-size="17" fill="#b9c8dd">保留地址与名称的对应关系</text><text x="54" y="474" font-size="23" fill="#fff">276 条原始记录</text><text x="290" y="474" font-size="24" fill="#72d5c3">→</text><text x="348" y="474" font-size="23" fill="#fff">24 个候选名称</text><text x="592" y="474" font-size="24" fill="#72d5c3">→</text><text x="651" y="474" font-size="23" fill="#fff">6 个 DNS 抽查样本</text><text x="1070" y="474" font-size="18" fill="#b9c8dd">实验过程示意</text></g></svg>